<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему - LiftMedia Price List Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            50: '#e6fbf8',
                            100: '#cdfaee',
                            200: '#9cf3dd',
                            300: '#60e6c8',
                            400: '#2dcfaf',
                            500: '#00c0a5',
                            600: '#009782',
                            700: '#00796b',
                            800: '#005f54',
                            900: '#004f46',
                            950: '#002e29',
                        }
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gray-900 via-black to-black px-4 relative overflow-hidden">

    <!-- Decorative ambient glows -->
    <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-emerald-500/10 blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-blue-500/10 blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-md" x-data="loginForm()" x-cloak>
        <div class="glass rounded-3xl p-8 md:p-10 shadow-[0_25px_50px_-12px_rgba(0,0,0,0.8)] border border-gray-800 relative z-10 transition-all duration-300 hover:border-gray-700/60">
            <!-- Logo & Title -->
            <div class="text-center mb-8">
                <div class="inline-flex p-3.5 bg-gradient-to-r from-emerald-500/15 to-blue-500/15 rounded-2xl border border-emerald-500/25 mb-4 shadow-inner">
                    <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight text-white bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                    LiftMedia Price
                </h1>
                <p class="text-sm text-gray-400 mt-2">Сервис управления адресными программами</p>
            </div>

            <!-- Error message banner -->
            <div x-show="errorMessage" 
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 -translate-y-2"
                 x-transition:enter-end="opacity-100 translate-y-0"
                 class="mb-6 bg-rose-950/45 border border-rose-500/30 text-rose-300 p-4 rounded-xl text-xs flex items-start gap-2.5" 
                 x-cloak>
                <svg class="w-4 h-4 shrink-0 text-rose-400 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
                <span x-text="errorMessage"></span>
            </div>

            <!-- Login Form -->
            <form @submit.prevent="submitLogin" class="space-y-6">
                <div>
                    <label for="username" class="block text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">Логин</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </span>
                        <input type="text" id="username" x-model="username" required
                               class="w-full pl-10 pr-4 py-3 bg-gray-950/70 border border-gray-800 rounded-xl text-sm text-white placeholder-gray-600 focus:outline-none focus:border-emerald-500/60 focus:ring-2 focus:ring-emerald-500/20 transition-all duration-200"
                               placeholder="Введите имя пользователя">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">Пароль</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m0 9v-9m0 0a3 3 0 00-3-3H9M12 9V7a4 4 0 00-8 0v4h8z"></path>
                            </svg>
                        </span>
                        <input type="password" id="password" x-model="password" required
                               class="w-full pl-10 pr-4 py-3 bg-gray-950/70 border border-gray-800 rounded-xl text-sm text-white placeholder-gray-600 focus:outline-none focus:border-emerald-500/60 focus:ring-2 focus:ring-emerald-500/20 transition-all duration-200"
                               placeholder="Введите пароль">
                    </div>
                </div>

                <button type="submit" :disabled="loading"
                        class="w-full bg-gradient-to-r from-blue-500 to-emerald-500 hover:from-blue-600 hover:to-emerald-600 active:scale-[0.98] text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-lg shadow-emerald-500/10 border border-emerald-400/20 flex items-center justify-center gap-2 mt-8 disabled:opacity-50 disabled:pointer-events-none">
                    <svg x-show="loading" class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span x-text="loading ? 'Вход...' : 'Войти'"></span>
                </button>
            </form>
        </div>
        <p class="text-center text-xs text-gray-600 mt-6 relative z-10">© 2026 LiftMedia. Все права защищены.</p>
    </div>

    <script>
        function loginForm() {
            return {
                username: '',
                password: '',
                loading: false,
                errorMessage: '',

                async submitLogin() {
                    this.loading = true;
                    this.errorMessage = '';

                    try {
                        const res = await fetch('/api/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: this.username,
                                password: this.password
                            })
                        });

                        const data = await res.json();
                        if (data.success) {
                            // Successful login: redirect to dashboard
                            window.location.href = '/index.html';
                        } else {
                            this.errorMessage = data.message || 'Ошибка входа в систему';
                        }
                    } catch (error) {
                        console.error('Login request error:', error);
                        this.errorMessage = 'Ошибка подключения к серверу. Попробуйте позже.';
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
